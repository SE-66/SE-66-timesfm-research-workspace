name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify, test, and build
        run: npm run check
      - name: Configured DevCloud build smoke test
        env:
          DEV_CLOUD_API_URL: http://localhost:8080
        run: |
          npm run build
          grep -F '"devCloudApiUrl":"http://localhost:8080"' dist/config.js
          grep -F "connect-src 'self' http://localhost:8080" dist/_headers
          grep -F "DevCloud Control Plane" dist/index.html
